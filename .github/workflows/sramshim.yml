# .github/workflows/sramshim.yml
#
# 独立 SRAM shim 构建流水线（与 build.yml 并行，不干扰 CubeGM 主构建）
#
# 目标：为 RK3036G（Cortex-A7, armhf, glibc 2.29, NEON, Mali-400）交叉编译
#      sramshim/libz_shim_v3.c 成 libz.so.1。文件名假装成 zlib，SONAME 故意
#      改成 libsramzlib.so（见源码注释），以便通过 LD_LIBRARY_PATH 劫持 +
#      dlopen 系统真 zlib 的自举技巧。
#
# 触发：sramshim/ 或本文件路径下任意改动 / 手动 dispatch / 打 tag
#      产物：libz.so.1.tar.gz + sha256sum + 构建日志
#
# 环境：ubuntu-22.04 apt 自带 g++-arm-linux-gnueabihf（GCC 11, glibc 2.35）
#      —— 与设备 glibc 2.29 差一代，用 .symver 强制锁 GLIBC_2.4，见源码注释。
name: sramshim

on:
  push:
    paths:
      - 'sramshim/**'
      - '.github/workflows/sramshim.yml'
  pull_request:
    paths:
      - 'sramshim/**'
      - '.github/workflows/sramshim.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sramshim
            .github/workflows/sramshim.yml

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            binutils
          arm-linux-gnueabihf-gcc --version | head -1
          arm-linux-gnueabihf-readelf --version | head -1

      - name: Probe sysroot for libdl.so.2 / libpthread.so.0
        id: sysroot
        run: |
          set -euo pipefail
          SYSROOT=$(arm-linux-gnueabihf-gcc -print-sysroot)
          echo "SYSROOT=$SYSROOT" >> $GITHUB_OUTPUT
          # Ubuntu 22.04 packages the ARM cross sysroot at /usr/arm-linux-gnueabihf/
          # but -print-sysroot returns empty.  Probe both known paths.
          DL=
          PT=
          for base in "$SYSROOT/lib/arm-linux-gnueabihf" \
                      /usr/lib/arm-linux-gnueabihf \
                      /usr/arm-linux-gnueabihf/lib \
                      /usr/arm-linux-gnueabihf/lib/arm-linux-gnueabihf; do
              [ -f "$base/libdl.so.2" ]      && DL="$base/libdl.so.2"
              [ -f "$base/libpthread.so.0" ] && PT="$base/libpthread.so.0"
          done
          [ -n "$DL" ] || { echo "libdl.so.2 not found"; exit 1; }
          [ -n "$PT" ] || { echo "libpthread.so.0 not found"; exit 1; }
          echo "LIBDL=$DL" >> $GITHUB_OUTPUT
          echo "LIBPTHREAD=$PT" >> $GITHUB_OUTPUT
          echo "Found libdl=$DL libpthread=$PT"

      - name: Build libz.so.1
        run: |
          set -euo pipefail
          CC=arm-linux-gnueabihf-gcc
          CFLAGS="-march=armv7-a -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -O2"
          mkdir -p dist
          $CC $CFLAGS -shared -fPIC -Wall -Wextra -s \
            -Wl,-soname,libsramzlib.so \
            -Wl,--version-script,sramshim/libz_shim_v2.map \
            -o dist/libz.so.1 sramshim/libz_shim_v3.c \
            -Wl,--no-as-needed ${{ steps.sysroot.outputs.LIBPTHREAD }} \
            -Wl,--no-as-needed ${{ steps.sysroot.outputs.LIBDL }}
          sha256sum dist/libz.so.1 > dist/sha256sum.txt
          cat dist/sha256sum.txt
          ls -la dist/

      - name: Verify ABI + symbol versions
        id: verify
        run: |
          set -euo pipefail
          export PYTHONIOENCODING=utf-8
          OBJDUMP=arm-linux-gnueabihf-objdump
          python3 - <<'PYEOF'
          import struct, subprocess, re, sys
          p = "dist/libz.so.1"
          d = open(p, "rb").read()

          # ELF header sanity
          assert d[:4] == b"\x7fELF", "not ELF"
          assert d[4] == 1, "must be 32-bit"
          assert d[5] == 1, "must be little-endian"
          etype, = struct.unpack_from("<H", d, 16)
          e_machine, = struct.unpack_from("<H", d, 18)
          e_flags, = struct.unpack_from("<I", d, 36)
          assert etype == 3, f"must be ET_DYN"
          assert e_machine == 0x28, f"must be EM_ARM"
          assert e_flags == 0x5000400, f"must be hard-float EABIv5"
          print(f"[ok] ET_DYN EM_ARM e_flags=0x{e_flags:x}")

          # Parse .dynamic for SONAME / NEEDED
          e_shoff, = struct.unpack_from("<I", d, 32)
          e_shentsize, e_shnum, e_shstrndx = struct.unpack_from("<HHH", d, 46)
          secs = []
          for i in range(e_shnum):
              o = e_shoff + i * e_shentsize
              (name, typ, flags, addr, off, size, link, info, align, entsize) = \
                  struct.unpack_from("<IIIIIIIIII", d, o)
              secs.append(dict(name=name, type=typ, off=off, size=size,
                               link=link, info=info, entsize=entsize, addr=addr))
          shstr = secs[e_shstrndx]
          def sname(s):
              e = d.index(b"\x00", shstr["off"] + s["name"])
              return d[shstr["off"] + s["name"]:e].decode()
          for s in secs: s["n"] = sname(s)

          dyn = next(s for s in secs if s["n"] == ".dynamic")
          ents, q = [], dyn["off"]
          while q < dyn["off"] + dyn["size"]:
              tag, val = struct.unpack_from("<II", d, q)
              ents.append((tag, val))
              if tag == 0: break
              q += 8
          strtab_va = next((v for t, v in ents if t == 5), None)
          base = None
          if strtab_va:
              for s in secs:
                  if s["type"] != 8 and s["addr"] and s["addr"] <= strtab_va < s["addr"] + s["size"]:
                      base = s["off"] + (strtab_va - s["addr"]); break
          need, soname = [], None
          if base:
              for t, v in ents:
                  if t == 1:
                      e = d.index(b"\x00", base + v); need.append(d[base + v:e].decode())
                  elif t == 14:
                      e = d.index(b"\x00", base + v); soname = d[base + v:e].decode()
          assert soname == "libsramzlib.so", f"SONAME={soname}"
          assert "libz.so.1" not in need, "SELF-REF"
          assert "libdl.so.2" in need, "missing libdl"
          assert "libpthread.so.0" in need, "missing libpthread"
          print(f"[ok] SONAME={soname} NEEDED={' '.join(need)}")

          # objdump -T for symbol versions
          r = subprocess.run(["arm-linux-gnueabihf-objdump", "-T", p], capture_output=True, text=True)
          assert r.returncode == 0, f"objdump failed: {r.stderr}"
          # Debug: print sample of objdump output
          lines = [l for l in r.stdout.splitlines() if l.strip()]
          print(f"[debug] objdump produced {len(lines)} non-empty lines")
          for l in lines[:10]:
              print(f"[debug] objdump line: {l[:120]}")
          EXPORTS, IMPORTS = {}, {}
          for line in r.stdout.splitlines():
              tokens = line.split()
              if len(tokens) < 4: continue
              if not re.match(r"^[0-9a-f]{8}$", tokens[0]): continue
              # Find SECTION: *UND* or .name
              si = None
              for i, t in enumerate(tokens):
                  if t == "*UND*" or (t.startswith(".") and i < len(tokens)-2):
                      si = i; break
              if si is None: continue
              section = tokens[si]
              si1 = si + 1
              if si1 >= len(tokens) or not re.match(r"^[0-9a-f]{8}$", tokens[si1]): continue
              vi = si1 + 1
              version = ""
              if vi < len(tokens) - 1:
                  v = tokens[vi]
                  if re.match(r"^GLIBC_\d+\.\d+$", v):
                      version = v; ni = vi + 1
                  else:
                      ni = vi
              else:
                  ni = vi
              name = tokens[ni] if ni < len(tokens) else ""
              if not name: continue
              if section == "*UND*":
                  IMPORTS[name] = version
              elif version:
                  EXPORTS[name] = version

          EXPECTED_IMPORTS = {"dlvsym": "GLIBC_2.4", "dlopen": "GLIBC_2.4",
                              "pthread_create": "GLIBC_2.4", "pthread_join": "GLIBC_2.4",
                              "pthread_attr_setstacksize": "GLIBC_2.4"}
          EXPECTED_EXPORTS = {"dlsym": "GLIBC_2.4", "compress": "GLIBC_2.4",
                              "uncompress": "GLIBC_2.4"}
          bad = []
          for nm, exp in EXPECTED_IMPORTS.items():
              got = IMPORTS.get(nm)
              if got != exp: bad.append(f"import {nm}: expected {exp}, got {got!r}")
          for nm, exp in EXPECTED_EXPORTS.items():
              got = EXPORTS.get(nm)
              if got != exp: bad.append(f"export {nm}: expected {exp}, got {got!r}")
          for nm, v in {**IMPORTS, **EXPORTS}.items():
              m = re.match(r"^GLIBC_(\d+)\.(\d+)$", v)
              if m and (int(m.group(1)), int(m.group(2))) > (2, 29):
                  bad.append(f"OVER-GLIBC {nm} -> {v}")
          if bad:
              print("VERIFICATION FAILED:")
              print("\n".join(bad))
              raise SystemExit(1)
          print(f"[ok] size={len(d)} B")
          print(f"[ok] exports: {', '.join(f'{k}={v}' for k, v in EXPECTED_EXPORTS.items())}")
          print(f"[ok] imports: {', '.join(f'{k}={IMPORTS[k]}' for k in EXPECTED_IMPORTS)}")
          print(f"[ok] all GLIBC <= 2.29")
          PYEOF

      - name: Package artifacts
        run: |
          cd dist
          tar czf libz.so.1.tar.gz libz.so.1 sha256sum.txt
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sramshim-libz
          path: dist/
          if-no-files-found: error
          retention-days: 90
