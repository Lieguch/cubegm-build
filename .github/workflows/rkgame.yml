name: rkgame-rebuild
"on":
  push:
    paths:
      - 'rkgame-rebuild/**'
      - '.github/workflows/rkgame.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore crosstool sysroot (glibc 2.29, shared with cubegm-build)
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: /home/runner/cubegm-tc
          key: tc-glibc229
          restore-keys: |
            tc-glibc229-

      - name: Install fallback ARM cross-toolchain (apt)
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf

      - name: Show compiler
        run: |
          if [ -x /home/runner/cubegm-tc/bin/arm-linux-gnueabihf-gcc ]; then
            export CC=/home/runner/cubegm-tc/bin/arm-linux-gnueabihf-gcc
            echo "Using crosstool-NG glibc-2.29 toolchain"
          else
            export CC=arm-linux-gnueabihf-gcc
            echo "Using apt gcc-arm-linux-gnueabihf (fallback)"
          fi
          "$CC" --version

      - name: Build
        run: |
          if [ -x /home/runner/cubegm-tc/bin/arm-linux-gnueabihf-gcc ]; then
            export CC=/home/runner/cubegm-tc/bin/arm-linux-gnueabihf-gcc
            export SYSROOT=/home/runner/cubegm-tc/arm-linux-gnueabihf/sysroot
          else
            export CC=arm-linux-gnueabihf-gcc
            export SYSROOT=
          fi
          cd rkgame-rebuild
          bash build.sh output/rkgame

      - name: ABI check
        run: |
          set -e
          OUT=rkgame-rebuild/output/rkgame
          if [ -x /home/runner/cubegm-tc/bin/arm-linux-gnueabihf-objdump ]; then
            OBJDUMP=/home/runner/cubegm-tc/bin/arm-linux-gnueabihf-objdump
            READELF=/home/runner/cubegm-tc/bin/arm-linux-gnueabihf-readelf
          else
            OBJDUMP=arm-linux-gnueabihf-objdump
            READELF=arm-linux-gnueabihf-readelf
          fi
          test -f "$OUT"
          echo "=== Dynamic symbols ==="
          "$OBJDUMP" -T "$OUT" | head -30
          echo "=== ELF header ==="
          file "$OUT"
          FLAGS=$("$READELF" -h "$OUT" | grep "Flags:" | awk '{print $2}' | tr -d ',')
          echo "e_flags=${FLAGS}"
          HEX_FLAGS=$(printf "%d" "${FLAGS}")
          FLOAT_ABI=$(( (HEX_FLAGS >> 9) & 0x3 ))
          echo "Float ABI: $FLOAT_ABI (0=soft, 1=softfp, 2=hardfp)"
          if [ "$FLOAT_ABI" != "2" ]; then
            echo "FATAL: binary is not hard-float (got $FLOAT_ABI)"
            exit 1
          fi
          if "$OBJDUMP" -T "$OUT" | grep -qE "GLIBC_2\.(3[4-9]|4[0-9]|5[0-9])"; then
            echo "FATAL: found GLIBC_2.34+ symbols"
            "$OBJDUMP" -T "$OUT" | grep "GLIBC_2.3\|GLIBC_2.4"
            exit 1
          fi
          echo "ABI check PASSED: hard-float, no 2.34+ symbols"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rkgame-arm
          path: rkgame-rebuild/output/rkgame
          if-no-files-found: error
