# Twin USB Gamepad (0810:0001:0110) — 原厂标配手柄
# 【v10.4】主驱动已切 udev：本文件是 linuxraw 兜底 profile（若手动改回 linuxraw 生效）。
#   udev 驱动下由官方 joypad-autoconfig/udev/Twin_USB_Joystick.cfg（VID=2064 PID=1）
#   自动匹配 —— 按钮/轴为 udev 语义，与官方一致，无需本文件。
# 配置来源：官方 udev/Twin_USB_Joystick.cfg（VID=2064 PID=1 三要素命中本设备）
# 方向键在轴 0/1（X/Y 模拟轴），非 HAT 轴 4/5，非按钮（§11.1 官方定案）
# 按钮索引（js Linux 按键编号）：0=Y 1=B 2=A 3=X 4=L1 5=R1 6=L2 7=R2 8=SELECT 9=START
# input_device 精确匹配 js* 设备名（内核 joydev JSIOCGNAME 返回 input_dev->name）
input_driver = "linuxraw"
input_joypad_driver = "linuxraw"
input_device = "Twin USB Gamepad"
input_vendor_id = "2064"
input_product_id = "1"
input_b_btn = "1"
input_a_btn = "2"
input_y_btn = "0"
input_x_btn = "3"
input_start_btn = "9"
input_select_btn = "8"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_up_axis = "-1"
input_down_axis = "+1"
input_left_axis = "-0"
input_right_axis = "+0"
