# RetroArch 配置 (CubeGM RK3036G)
# 生成：2026-08-25 (v2 — SDL1.2 驱动)
# 架构：sdl (SDL 1.2 fbcon framebuffer 直出, 项目已在 sysroot 交叉编译) + alsa + linuxraw (非 X11/DRM)

# ----- 显示 -----
video_driver = "sdl"
video_fullscreen = "true"
video_fullscreen_x = "1280"
video_fullscreen_y = "720"
video_monitor_index = "0"
video_refresh_rate = "60.000000"
video_scale_integer = "false"
video_aspect_ratio = "auto"
aspect_ratio_index = "16:9"

# ----- 音频 -----
# audio_device=default 让 ALSA 自动选择系统默认设备（HDMI + speaker 混合输出）
audio_driver = "alsa"
audio_device = "default"
audio_out_rate = "44100"
audio_rate_control = "true"
audio_sync = "true"

# ----- 输入 -----
# linuxraw 读 /dev/input/js*（joystick API），非 evdev。
# joypad_autoconfig_dir：RetroArch 首次连接手柄后自动识别 VID:PID 并保存 profile，
# 下次启动即自动加载——无需硬编码按钮索引（那套需要猜设备 layout，用户已纠正）。
input_driver = "linuxraw"
input_autodetect_enable = "true"
input_joypad_driver = "linuxraw"
joypad_autoconfig_dir = "/mnt/sdcard/cubegm/autoconfig"

# 输入 玩家1 硬编码兜底（sf3000_keymap 官方映射，防止 autoconfig 失败时无手柄）
input_player1_b_btn = "1"
input_player1_a_btn = "2"
input_player1_y_btn = "0"
input_player1_x_btn = "3"
input_player1_start_btn = "9"
input_player1_select_btn = "8"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "6"
input_player1_r2_btn = "7"
input_player1_up_axis = "-5"
input_player1_down_axis = "+5"
input_player1_left_axis = "-4"
input_player1_right_axis = "+4"

# ----- 菜单 UI -----
menu_driver = "rgui"
# 中文字体路径（payload 含 font.ttf 1.8MB，stb_truetype 渲染）
menu_font = "/mnt/sdcard/cubegm/font.ttf"

# ----- 路径 -----
libretro_directory = "/mnt/sdcard/cubegm/cores"
libretro_info_path = "/mnt/sdcard/cubegm/cores"
system_directory = "/mnt/sdcard/cubegm/system"
savestate_directory = "/mnt/sdcard/cubegm/states"
savefile_directory = "/mnt/sdcard/cubegm/saves"
content_directory = "/mnt/sdcard"
game_history_dir = "/mnt/sdcard/cubegm"
rgui_browser_directory = "/mnt/sdcard"

# ----- 性能 -----
rewind_enable = "false"
video_frame_delay = "0"
video_threaded = "false"
audio_latency = "64"
cache_buffer_size = "32"

# ----- 收藏/历史 -----
favorites_path = "/mnt/sdcard/cubegm/favorites.lst"
game_history_path = "/mnt/sdcard/cubegm/recent.lst"
content_history_enable = "true"
content_favorites_enable = "true"

# ----- 语言 (中文) -----
user_language = "2"