# RetroArch 配置 (CubeGM RK3036G)
# 生成：2026-08-25 (v2 — SDL1.2 驱动)
# 架构：sdl (SDL 1.2 fbcon framebuffer 直出, 项目已在 sysroot 交叉编译) + alsa + linuxraw (非 X11/DRM)

# ----- 显示 -----
video_driver = "sdl"
video_fullscreen = "true"
video_fullscreen_x = "1280"
video_fullscreen_y = "720"
video_monitor_index = "0"
video_refresh_rate = "60.000000"
video_scale_integer = "false"
video_aspect_ratio = "auto"
aspect_ratio_index = "16:9"

# ----- 音频 -----
# audio_device=default 让 ALSA 自动选择系统默认设备（HDMI + speaker 混合输出）
audio_driver = "alsathread"
audio_device = "default"
audio_out_rate = "48000"
audio_rate_control = "true"
audio_sync = "true"

# ----- 输入 -----
# v10.4: udev 输入驱动（非 linuxraw）。linuxraw 传 vid=0/pid=0、仅名字匹配、零鼠标支持；
# udev 驱动经 EVIOCGID 读真实 VID/PID + EVIOCGNAME 读名字，四要素(driver+name+VID+PID)
# 自动匹配官方 1099 特征库 -> 插什么手柄认什么 + 鼠标(需求2) + 按钮对齐官方 udev 语义。
# 依赖 libudev（libudev-zero 交叉编译进 sysroot，部署 libudev.so.1 到 cubegm/lib，
# 无需 udevd 守护进程：枚举读 /sys，hotplug 直连内核 netlink）。
# 注：删除 linuxraw 时代的 input_player1_* 硬编码（js 索引值在 udev 下是错误值），
#     玩家 1 由 autoconfig（udev/Twin_USB_Joystick.cfg, VID 2064 PID 1）自动绑定。
input_driver = "udev"
input_autodetect_enable = "true"
input_joypad_driver = "udev"
joypad_autoconfig_dir = "/mnt/sdcard/cubegm/autoconfig"
# RGUI 鼠标指针（需求2，udev 驱动原生支持）
menu_mouse_enable = "true"

# ----- 菜单 UI -----
menu_driver = "rgui"
# 中文字体路径（payload 含 font.ttf 1.8MB，stb_truetype 渲染）
menu_font = "/mnt/sdcard/cubegm/font.ttf"

# ----- 路径 -----
libretro_directory = "/mnt/sdcard/cubegm/cores"
libretro_info_path = "/mnt/sdcard/cubegm/cores"
system_directory = "/mnt/sdcard/cubegm/system"
savestate_directory = "/mnt/sdcard/cubegm/states"
savefile_directory = "/mnt/sdcard/cubegm/saves"
content_directory = "/mnt/sdcard"
game_history_dir = "/mnt/sdcard/cubegm"
rgui_browser_directory = "/mnt/sdcard"
# v0.2 (中文根治): RGUI 位图字体目录（bitmap10x10_chn.bin 等）。
# RetroArch 按 user_language 从 <assets_directory>/rgui/font/ 动态加载字形，
# 缺失则 bitmapfont_10x10_load() 返回 NULL → 中文翻译虽编译进二进制但无字形。
assets_directory = "/mnt/sdcard/cubegm/assets"

# ----- 性能 -----
rewind_enable = "false"
video_frame_delay = "0"
video_threaded = "false"
audio_latency = "64"

# ----- v0.8 音频多通道测试入口（用户可切换） -----
# 402 baseline（低音质 default）—— 上面 audio_device="default" 保持不变
# 下面 14 个可测 audio_device 通道是 cfg 注释，用户在 Settings → Audio
# 菜单里直接选，无需修改 cfg。来源：407 diag + Libretro 论坛 #1696 + DTB 解析。
#
# [Baseline] 402 实证（保留生效）—— 共享 I2S 总线 HDMI+扬声器双端同响
#   audio_device = "default"            ← 当前默认值
#
# [A] tinyalsa 已知工作（407 日志 [TINYALSA] Using card: 0, device: 0）
#   audio_device = "hw:0,0"             ← 强制直通 I2S 总线
#
# [B] 扬声器原生 PCM（Libretro 论坛 #1696 官方推荐 + DTB 00-01: rk3036-voice）
#   audio_device = "hw:0,1"             ← 第一次试，原厂 icube 配置在 device 0
#
# [C] Linux 系统默认（路径不同，可能绕过某些配置）
#   audio_device = "sysdefault"
#
# [D/E] ALSA plug 插件自动转换（format/rate/channel 协商）
#   audio_device = "plughw:0,0"         ← plug + HDMI
#   audio_device = "plughw:0,1"         ← plug + 扬声器
#
# [H/I] 强制 tinyalsa 后端（绕过 ALSA 配置树）—— 改 audio_driver 后用
#   audio_driver  = "tinyalsa"
#   audio_device  = "hw:0,0"            ← tinyalsa 直开 HDMI 总线
#   audio_device  = "hw:0,1"            ← tinyalsa 直开扬声器
#
# [J/K/L/M/N] 切换驱动测试（需改 audio_driver + 重启）
#   audio_driver  = "alsathread"        ← 当前默认（线程化，写不阻塞主线程）
#   audio_driver  = "alsa"              ← 同步 ALSA（写阻塞主线程）
#   audio_driver  = "sdl"               ← SDL1.2 后端（407 日志：libasound 1.2.10 路径错会失败）
#   audio_driver  = "oss"               ← OSS 兼容（无 /dev/dsp 会失败）
#   audio_driver  = "null"              ← 静音（仅验证驱动列表完整性）
#
# ----- 已知排除 -----
#   S32_LE（407 实证：ALSA 内核自动降级 S32→S16 但 tinyalsa frame_bits 仍按 8 字节/帧算
#   → 数据错位 → 静音。根因：tinyalsa 写空间与内核 VDW 协商不一致。源：407 diag
#   0x10220000=0x0f 解码 = VDW=16。修复需要改 RetroArch 源码 zero-pad 转换，
#   不在本 cfg 范围内）
# ----- 测试方法 -----
#   F1 → Settings → Audio → Audio Device 上下切 → 听声
#   切 audio_driver 需改本 cfg + 重启 RetroArch
#   任何通道无声音请回传 retroarch_ra.log + diag_report.txt

cache_buffer_size = "32"

# ----- 收藏/历史 -----
favorites_path = "/mnt/sdcard/cubegm/favorites.lst"
game_history_path = "/mnt/sdcard/cubegm/recent.lst"
content_history_enable = "true"
content_favorites_enable = "true"

# ----- 日志 (v10.9 开机即 Debug：log_verbosity=true 让 udev 枚举/autoconfig 匹配/
#  语言表加载等 [INFO]/[WARN] 全部写入 retroarch.log（icube 已把 stdout/stderr
#  重定向到 /mnt/sdcard/retroarch.log）。此前 log_verbosity 默认关，驱动初始化
#  过程不可见，是手柄/语言无法诊断的根因之一。)
log_verbosity = "true"
log_to_file = "false"
log_dir = "/mnt/sdcard"

# ----- 语言 (中文) -----
user_language = "12"