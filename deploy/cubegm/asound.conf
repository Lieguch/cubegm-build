# CubeGM ALSA 根治配置 v11.9 —— 共享 I2S 总线 · 扬声器端点（官方机制）
#
# == 根因链（399 实机 4 份日志 + 官方源码三重证据） ==
# ① 399 retroarch.log：无 Unknown PCM（v11.8 配置树已修通、PCM 可打开），但
#    default=hw:0,0（HDMI）只驱动 HDMI 端点；内置扬声器是独立 PCM「hw:0,1
#    (rk3036-voice)」，其 codec DAPM（功放使能寄存器）依赖 hw:0,1 被 open
#    -> 从未打开 -> 扬声器功放不上电 -> 必然无声（underrun x24 = HDMI 数据无人消费）
# ② diag /proc/asound/pcm 实证：00-00 i2s-hifi(HDMI) + 00-01 rk3036-voice(扬声器)
#    -> 要驱动内置扬声器必须 open hw:0,1
# ③ rockchip_i2s 单 TX DMA(I2S_TXDR) -> 同一 I2S 总线只能单流 -> multi 双开
#    第二流拿不到 DMA（v11.7 multi 是错路）；正确 = 单点 open 扬声器端点，
#    I2S 物理总线广播让 HDMI codec 同收（原厂 driver.so 同构：单 PCM 双端响）
# ④ Invalid CTL hw:0 = 自包含 asound.conf 缺 ctl.hw 定义 -> 本版补齐
#
# 本机模拟（提交前）：default/hw:0,1/hdmi/speaker 全部 0 Unknown PCM + 0 Invalid CTL

# 官方 defaults（供 @func refer 引用）
defaults.ctl.card 0
defaults.pcm.card 0
defaults.pcm.device 1          # 默认输出端点 = 内置扬声器 (rk3036-voice)
defaults.pcm.subdevice -1
defaults.namehint.basic on

# 官方同款 pcm.hw 模板（提供 hw:N,M 引用节点）
pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type string default { @func refer name defaults.pcm.card } }
    @args.DEV  { type integer default { @func refer name defaults.pcm.device } }
    @args.SUBDEV { type integer default { @func refer name defaults.pcm.subdevice } }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}

# 默认输出：plug -> hw:0,1（内置扬声器）。I2S 物理总线共享 -> HDMI codec
# 同时收到同一路数据 -> 扬声器 + HDMI 双端出声（原厂机制，非 multi）。
# plug 自动处理采样率/格式转换（48kHz S16_LE -> codec 原生）。
pcm.!default {
    type plug
    slave.pcm {
        type hw
        card 0
        device 1
    }
}

# 独立命名设备（备用诊断 / 未来 HDMI 直连）
pcm.hdmi {
    type plug
    slave.pcm { type hw card 0 device 0 }
}
pcm.speaker {
    type plug
    slave.pcm { type hw card 0 device 1 }
}

# 控制接口（官方模板，消除 Invalid CTL hw:0）
ctl.hw {
    @args [ CARD ]
    @args.CARD {
        type string
        default {
            @func getenv
            vars [ ALSA_CTL_CARD ALSA_CARD ]
            default { @func refer name defaults.ctl.card }
        }
    }
    type hw
    card $CARD
}

ctl.!default {
    type hw
    card 0
}