# CubeGM ALSA configuration for RK3036G (v11.8 定稿 —— 单点输出)
# =========================================================
# 硬件事实（linux v4.4 rockchip_i2s.c + diag + 原厂 DTB + 用户实证）：
#   card 0: rockchiphdmi
#     device 0: i2s-hifi          (HDMI 音频输出, 10220000.i2s)
#     device 1: rk3036-voice      (内置扬声器 voice codec)
#   RK3036 I2S = 单 TX DMA、单 playback DAI、共享物理总线
#   -> HDMI(0,0) 与 扬声器(0,1) 共用同一 SDI/SDO/BCLK/LRCK
#   -> 写 hw:0,0 时扬声器同流出声（原厂行为：snd_pcm_open("default") 单开即双端响）
#
# 铁律：禁 pcm.multi / dualroute —— 双开两个挂同一 I2S 控制器的 PCM 是黑屏家族诱因。
# 正确形态 = 单点 plug -> hw:0,0。
# =========================================================

# --- 默认输出：plug 自动采样率/格式转换 -> 单点 hw:0,0（共享总线 → HDMI+扬声器同响）---
pcm.!default {
    type plug
    slave.pcm { type hw card 0 device 0 }
}

# --- 独立命名设备（诊断备用）---
pcm.hdmi {
    type plug
    slave.pcm { type hw card 0 device 0 }
}
pcm.speaker {
    type plug
    slave.pcm { type hw card 0 device 1 }
}

# --- 控制接口 ---
ctl.!default {
    type hw
    card 0
}