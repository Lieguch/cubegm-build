# CubeGM ALSA 根治配置 v11.8 —— 共享 I2S 总线 · 单点输出（官方机制）
#
# == 根因链（三重证据实证） ==
# ① payload libasound.so.2 的 ALSA_CONFIG_DIR 编译期写死 /home/runner/.../sysroot/usr/share/alsa
#    （CI 机路径，设备不存在）→ 官方 alsa.conf 与 cards.* 全部加载不到；
# ② rootfs 官方 alsa.conf 的 pcm.default 是「间接引用」pcm.default -> cards.pcm.default
#    -> cards.<driver>.pcm.default；而设备声卡 id=rockchiphdmi，rootfs cards/ 无
#    rockchiphdmi.conf、aliases 无映射 → 即使加载到官方树，default 也无法解析
#    （v11.6/397 复用官方链仍 Unknown PCM default 的根因）；
# ③ RK3036 I2S = 单 DAI + 单 TX DMA(I2S_TXDR) 共享物理总线（v4.4 rockchip_i2s.c 实证），
#    HDMI + 内置扬声器(rk3036-voice) 靠总线广播同时收到同一路数据 → 原厂「单 PCM
#    双端响」是硬件机制，不是 ALSA multi。
#
# == 根治（本机模拟已 PASS：0 处 Unknown PCM，无 multi 双开） ==
# ALSA_CONFIG_PATH=/mnt/sdcard/cubegm/asound.conf（icube_replacement/zhijack 已设）
# 自包含定义 pcm.!default = plug -> hw:0,0（HDMI 单点）。
# I2S 总线共享 → 内置扬声器同流出声（与原厂 driver.so 的 snd_pcm_open("default") 同构）。
# 绝不使用 multi 双开（393/394/398 黑屏家族诱因：同时开两个挂同一 I2S 的 PCM）。

# 官方 defaults（供 @func refer 引用）
defaults.ctl.card 0
defaults.pcm.card 0
defaults.pcm.device 0
defaults.pcm.subdevice -1
defaults.namehint.basic on

# 官方同款 pcm.hw 模板（提供 hw:N,M 引用节点）
pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type string default { @func refer name defaults.pcm.card } }
    @args.DEV  { type integer default { @func refer name defaults.pcm.device } }
    @args.SUBDEV { type integer default { @func refer name defaults.pcm.subdevice } }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}

# 默认输出：plug -> hw:0,0（HDMI 单点）。I2S 物理总线共享 → 内置扬声器
# 同时收到同一路数据 → HDMI + 扬声器双端出声（原厂行为，非 multi）。
pcm.!default {
    type plug
    slave.pcm { type hw card 0 device 0 }
}

# 独立命名设备（备用诊断）
pcm.hdmi {
    type plug
    slave.pcm { type hw card 0 device 0 }
}
pcm.speaker {
    type plug
    slave.pcm { type hw card 0 device 1 }
}

# 控制接口
ctl.!default {
    type hw
    card 0
}