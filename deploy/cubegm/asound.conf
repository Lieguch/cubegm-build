# CubeGM ALSA configuration for RK3036G (v11.2)
# =========================================================
# 硬件事实（diag + 原厂DTB + 用户实证）：
#   card 0: rockchiphdmi
#     device 0: i2s-hifi          (HDMI 音频输出)
#     device 1: rk3036-voice      (内置扬声器语音codec)
# 原厂行为：双通道【同时】出声（HDMI + 内置扬声器一起响）
#   —— 用户实证：开机「power on」语音 + MIDI，双端同时听到
# 根因：旧配置 pcm.default = type hw card 0 device 0
#       只路由到 HDMI（device 0），内置扬声器（device 1）完全没喂数据
#       -> 用户听不到声音（HDMI 若无外接屏/功放则静默）
# 方案：default 用 multi 同时喂两个 slave（HDMI + 扬声器），
#       再用 route 把立体声 L/R 复制到两端。48kHz S16_LE 统一。
# =========================================================

# --- 双输出合流：同时写 HDMI(0,0) + 内置扬声器(0,1) ---
pcm.dual {
    type multi
    slaves.a.pcm "hw:0,0"        # HDMI
    slaves.b.pcm "hw:0,1"        # 内置扬声器
    slaves.a.channels 2
    slaves.b.channels 2
    bindings.0.slave a
    bindings.0.channel 0
    bindings.1.slave a
    bindings.1.channel 1
    bindings.2.slave b
    bindings.2.channel 0
    bindings.3.slave b
    bindings.3.channel 1
}

# --- 立体声 -> 双设备 4 声道（L/R 同时复制到两端）---
pcm.dualroute {
    type route
    slave.pcm "dual"
    slave.channels 4
    ttable.0.0 1.0    # 输入L -> 输出0 (HDMI L)
    ttable.1.1 1.0    # 输入R -> 输出1 (HDMI R)
    ttable.0.2 1.0    # 输入L -> 输出2 (扬声器 L)
    ttable.1.3 1.0    # 输入R -> 输出3 (扬声器 R)
}

# --- 默认输出：plug 自动采样率转换 -> 双路合流 ---
pcm.!default {
    type plug
    slave.pcm "dualroute"
    hint {
        description "CubeGM Dual Output (HDMI + Speaker)"
        device_output "dual"
    }
}

# --- 独立命名设备（备查/测试用）---
pcm.hdmi {
    type plug
    slave.pcm "hw:0,0"
}
pcm.speaker {
    type plug
    slave.pcm "hw:0,1"
}

# --- 控制接口 ---
ctl.!default {
    type hw
    card 0
}
