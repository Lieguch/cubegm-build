# CubeGM ALSA configuration for RK3036G (v0.11 —— 锁 S16_LE + 命名前缀避免冲突)
# =================================================================
# 注：build.sh STAGE 9 部署的是 .asoundrc（不是 asound.conf），本文件为同源
# 备份，避免 build.sh 后续切换部署路径时遗漏。实际生效路径：
#   /mnt/sdcard/cubegm/.asoundrc（icube_replacement 设 HOME=/mnt/sdcard/cubegm
#   后被设备 rootfs alsa.conf @hooks 自动加载）
#
# 硬件事实（linux v4.4 rockchip_i2s.c + diag + 原厂 DTB + 442 实机 6 份日志）：
#   card 0: rockchiphdmi
#     device 0: i2s-hifi        (HDMI 音频输出, 10220000.i2s)
#     device 1: rk3036-voice    (内置扬声器 voice codec)
#   RK3036 I2S = 单 TX DMA、单 playback DAI、共享物理总线
#   -> HDMI(0,0) 与 扬声器(0,1) 共用同一 SDI/SDO/BCLK/LRCK
#   -> 写 hw:0,0 时扬声器同流出声（原厂行为：snd_pcm_open("default") 单开即双端响）
#
# 关键铁律（v0.11 用户定案 2026-09-01）：
#   - acodec-ana 物理只支持 S16_LE；S24/S32 必 underrun/zero-pad 静默
#   - 442 实机：plug 路径 open S32 成功但 snd_pcm_recover 持续触发 -> 静音
#   - 修复：slave 节点锁 format S16_LE + rate 48000 + channels 2，plug 层无
#     需做用户态格式转换 -> 零 underrun
#
# 命名避坑（alsa.conf 144 行 pcm.hdmi = cards.pcm.hdmi 引用）：
#   - 备选设备不能叫 pcm.hdmi / pcm.default / pcm.sysdefault（已被引用）
#   - 用 cubegm_ 前缀：pcm.cubegm_hdmi / pcm.cubegm_speaker
#   - ！保留 pcm.!default 强制覆盖系统的 pcm.default 引用
#   - ！保留 ctl.!default 强制覆盖
#
# 禁用 pcm.multi / dualroute —— 双开两个挂同一 I2S 控制器的 PCM 是黑屏家族诱因。
# 正确形态 = 单点 plug -> hw:0,0，共享总线 -> HDMI+扬声器同响。
# =================================================================

# --- 默认输出（强制覆盖系统 pcm.default 引用）：plug 锁 S16_LE -> hw:0,0 ---
pcm.!default {
    type plug
    slave {
        pcm "hw:0,0"
        format S16_LE
        rate 48000
        channels 2
    }
}

# --- 独立命名设备（诊断 + 用户手动选择 audio_device=...）---
# cubegm_hdmi = 共享总线到扬声器路径（与 default 等价，仅作显式命名）
pcm.cubegm_hdmi {
    type plug
    slave {
        pcm "hw:0,0"
        format S16_LE
        rate 48000
        channels 2
    }
}

# cubegm_speaker = 直通内置扬声器（绕过 HDMI 端点；fallback 用）
pcm.cubegm_speaker {
    type plug
    slave {
        pcm "hw:0,1"
        format S16_LE
        rate 48000
        channels 2
    }
}

# --- 控制接口（强制覆盖）---
ctl.!default {
    type hw
    card 0
}
