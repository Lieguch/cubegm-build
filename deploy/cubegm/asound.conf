# CubeGM ALSA 根治配置（v11.7，自包含，官方机制）
# 根因：payload 的 libasound.so.2 由 crosstool sysroot 编译，ALSA_CONFIG_DIR 写死为
#   CI 机路径 /home/runner/cubegm-tc/arm-linux-gnueabihf/sysroot/usr/share/alsa
#   （设备上不存在）→ 官方 alsa.conf 与 @hooks 全部加载不到 → Unknown PCM default。
# 修：用 ALSA_CONFIG_PATH 直指本自包含文件（官方环境变量机制，不依赖 datadir）。
#   pcm.hw 内联定义（官方 alsa.conf 同款），pcm.!default = plug->route->multi
#   (hw:0,0 HDMI + hw:0,1 内置扬声器)，slave 全内联 type hw（禁字符串 "hw:0,0"）。
#   禁改 44100/48000（plug 自动采样率转换）。无 hint 块（避免整数域误用）。
# 本机模拟已验证：default/hw:0,0/hw:0,1/dualroute/dual 全部解析成功（仅宿主无声卡 ENOENT）。

# 官方 defaults（供 pcm.hw @args 引用）
defaults.ctl.card 0
defaults.pcm.card 0
defaults.pcm.device 0
defaults.pcm.subdevice -1
defaults.namehint.basic on

pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type string default { @func refer name defaults.pcm.card } }
    @args.DEV  { type integer default { @func refer name defaults.pcm.device } }
    @args.SUBDEV { type integer default { @func refer name defaults.pcm.subdevice } }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}

pcm.!default {
    type plug
    slave.pcm {
        type route
        slave.pcm {
            type multi
            slaves.a.pcm { type hw card 0 device 0 }
            slaves.b.pcm { type hw card 0 device 1 }
            slaves.a.channels 2
            slaves.b.channels 2
            bindings.0.slave a
            bindings.0.channel 0
            bindings.1.slave a
            bindings.1.channel 1
            bindings.2.slave b
            bindings.2.channel 0
            bindings.3.slave b
            bindings.3.channel 1
        }
        slave.channels 4
        ttable.0.0 1.0
        ttable.1.1 1.0
        ttable.0.2 1.0
        ttable.1.3 1.0
    }
}

ctl.!default {
    type hw
    card 0
}
